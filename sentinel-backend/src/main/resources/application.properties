spring.application.name=api-sentinel
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/api_sentinel_db
spring.datasource.username=sentinel_app
spring.datasource.password=${API_SENTINEL_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never