spring.application.name=api-sentinel
server.port=8080
# Local-only by default; override explicitly for a secured deployment.
server.address=127.0.0.1

# Bound untrusted OpenAPI uploads to limit memory and parser abuse.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/api_sentinel_db
spring.datasource.username=sentinel_app
spring.datasource.password=${API_SENTINEL_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
sentinel.target.base-url=http://localhost:8081
sentinel.credentials.alice=${API_SENTINEL_ALICE_PASSWORD:}
sentinel.credentials.bob=${API_SENTINEL_BOB_PASSWORD:}
sentinel.credentials.admin=${API_SENTINEL_ADMIN_PASSWORD:}