
spring.application.name=api-sentinel-test

# Isolated PostgreSQL test database
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/api_sentinel_test_db
spring.datasource.username=sentinel_app
spring.datasource.password=${API_SENTINEL_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Disable web server for tests
spring.main.web-application-type=none
